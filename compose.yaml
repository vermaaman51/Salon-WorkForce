services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salon
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - salon_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  salon_data:
