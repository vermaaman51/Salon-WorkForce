spring.application.name=Salon Workforce
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:postgres.railway.internal}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${DB_USER:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD}}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie


# One final SQL definition per table; database-specific history triggers.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
